name: Docker Build & Push

on:
  schedule:
    - cron: '16 18 * * 6'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/step-ca

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  prepare:
    name: Get latest release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
    steps:
      - name: Get latest release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/smallstep/certificates/releases/latest | jq -er '.tag_name')
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${TAG}"

  build:
    name: Build (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ matrix.architecture }}
          cache-from: type=gha,scope=build-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.architecture }}
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${{ runner.temp }}/digests"

          digest="${DIGEST#sha256:}"

          if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid image digest: ${DIGEST}"
            exit 1
          fi

          echo -n "$digest" > "${{ runner.temp }}/digests/$digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest and push
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ runner.temp }}/digests"

          shopt -s nullglob
          digests=(*)

          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "::error::Expected 2 image digests, found ${#digests[@]}"
            ls -la
            exit 1
          fi

          images=()

          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid digest filename: $digest"
              exit 1
            fi

            images+=("${IMAGE_NAME}@sha256:${digest}")
          done

          echo "Creating manifest for ${IMAGE_NAME}:${VERSION}"

          docker buildx imagetools create             --tag "${IMAGE_NAME}:latest"             --tag "${IMAGE_NAME}:${VERSION}"             "${images[@]}"

      - name: Inspect the resulting image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"